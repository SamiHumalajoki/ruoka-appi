<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruoka-appi · Perheen viikkoruoka</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A1F22; min-height: 100vh; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #0F2A2E;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(20,184,166,0.18), transparent 60%),
      radial-gradient(900px 600px at -10% 100%, rgba(255,122,89,0.15), transparent 60%),
      #0A1F22;
  }
  #root {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 16px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  input, textarea, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes rospin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="recipes.jsx"></script>
